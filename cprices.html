<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>平日購物比價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2328; --muted:#656d76; --line:#d0d7de; --line2:#e4e8ec;
  --head:#eef1f4; --band:#f8f9fb; --bg:#f3f4f6; --card:#fff;
  --green:#1a7f4b; --greenbg:#e3f3ea; --greenline:#9fd4b5;
  --blue:#0b5cad; --bluebg:#e7f0fa;
  --amber:#8a5a00; --amberbg:#fff4d6; --amberline:#e8c870;
  --red:#b42318; --redbg:#fde8e6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans TC',-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font-family:inherit;font-size:14px;color:inherit}
.num,td.num,th.num{font-variant-numeric:tabular-nums}

/* 頂欄 */
.top{background:#1f2937;color:#fff;position:sticky;top:0;z-index:60}
.top-in{max-width:1500px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;min-height:46px;flex-wrap:wrap}
.ttl{font-weight:700;font-size:16px;letter-spacing:.02em;padding:10px 0}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav button{background:none;border:0;color:#c9d1d9;padding:14px 14px 12px;cursor:pointer;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:#4ade80}
.nav .cnt{background:#f87171;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:700}
.top a{color:#c9d1d9;text-decoration:none;font-size:13px}
.top a:hover{color:#fff}
.sync{font-size:12px;color:#c9d1d9;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.off{background:#f87171}.dot.wait{background:#fbbf24}

.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.panel{display:none}.panel.on{display:block}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--head)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:#156a3e}
.btn.dan{color:var(--red);border-color:#f1b8b2}
.btn.dan:hover{background:var(--redbg)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tool input[type=search],.tool select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:#fff;min-width:150px}
.tool .grow{flex:1}
.sum{color:var(--muted);font-size:13px}

/* 提醒橫幅 */
.banner{display:none;background:var(--amberbg);border:1px solid var(--amberline);color:var(--amber);border-radius:6px;padding:9px 14px;margin-bottom:10px;cursor:pointer;justify-content:space-between;gap:10px;align-items:center}
.banner b{font-weight:700}

/* 格線表格 */
.sheet{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:calc(100vh - 190px)}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.g th{position:sticky;top:0;z-index:2;background:var(--head);border-bottom:1px solid var(--line);border-right:1px solid var(--line2);padding:8px 10px;text-align:left;font-weight:700;color:#3d444d;white-space:nowrap;font-size:12.5px}
.g td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:6px 10px;white-space:nowrap;vertical-align:middle}
.g th:last-child,.g td:last-child{border-right:0}
.g td.num,.g th.num{text-align:right}
.g td.c,.g th.c{text-align:center}
.g td.wr{white-space:normal;min-width:100px}
.g tr.first td{border-top:2px solid #aab4bf}
.g tbody tr.first:first-child td{border-top:0}
.g tr.alt td{background:var(--band)}
.g tr.buy td{background:var(--greenbg)}
.g tr.buy td.pcell{box-shadow:inset 3px 0 0 var(--green)}
.g td.cs{background:#fff;vertical-align:top;font-weight:500}
.g tr.alt td.cs{background:var(--band)}
.g td.merge{background:inherit}
.g tr:hover td:not(.cs){background:#f0f6ff}
.g tr.buy:hover td:not(.cs){background:#d4ecdd}
.mark{display:inline-block;padding:0 7px;border-radius:9px;font-size:11.5px;font-weight:700;line-height:18px}
.mk-buy{background:var(--green);color:#fff}
.mk-low{background:#fff;color:var(--green);border:1px solid var(--greenline)}
.mk-none{background:var(--amberbg);color:var(--amber);border:1px solid var(--amberline)}
.mk-diff{color:var(--red);font-weight:500}
.sub{color:var(--muted);font-size:12px}
.tag{display:inline-block;padding:0 7px;border-radius:3px;font-size:12px;font-weight:500;background:var(--head);border:1px solid var(--line)}
.empty{padding:36px;text-align:center;color:var(--muted)}

/* 編輯器 */
.ed{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;display:none}
.ed.on{display:block}
.ed-h{background:var(--head);border-bottom:1px solid var(--line);padding:9px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.ed-b{padding:14px}
.hg{display:grid;grid-template-columns:140px minmax(200px,2fr) minmax(140px,1fr) 90px 130px minmax(160px,2fr);gap:10px}
.fg{display:flex;flex-direction:column;gap:3px;min-width:0}
.fg label{font-size:12px;color:var(--muted);font-weight:700}
.fg input,.fg select,.et input,.et select{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;width:100%;min-width:0}
.fg input:focus,.fg select:focus,.et input:focus,.et select:focus{outline:2px solid #8cc4ff;outline-offset:-1px;border-color:var(--blue)}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:18px}
.hint b{color:var(--ink)}
.et-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:4px}
.et{border-collapse:collapse;width:100%;min-width:1080px}
.et th{background:var(--head);border-bottom:1px solid var(--line);border-right:1px solid var(--line2);padding:6px 8px;font-size:12px;text-align:left;white-space:nowrap}
.et td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:3px;vertical-align:middle}
.et td:first-child{min-width:118px}
.et td:nth-child(2){min-width:120px}
.et td.ro input{background:var(--band);text-align:right}
.et input[type=number]{text-align:right}
.et td.rd{text-align:center;width:64px}
.et td.rd input{width:18px;height:18px;accent-color:var(--green)}
.et tr.buyrow td{background:var(--greenbg)}
.et .x{width:28px}
.ed-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ed-f .sp{flex:1}
.note-off{opacity:.45}

/* 提醒 */
.rem{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--amberline);border-left:4px solid #e0a100;border-radius:6px;padding:10px 14px;margin-bottom:8px}
.rem.over{border-color:#f1b8b2;border-left-color:var(--red)}
.rem .t{font-weight:700}
.rem .m{font-size:12.5px;color:var(--muted)}
.rem .b{display:flex;gap:6px;flex-wrap:wrap}
.sec{font-weight:700;margin:16px 0 6px;color:#3d444d}

/* 查詢 */
.card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:14px}
.card-h{background:var(--head);border-bottom:1px solid var(--line);padding:9px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line);border-radius:4px;margin-bottom:14px}
.kpi{padding:9px 12px;border-right:1px solid var(--line2)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--red)}.down{color:var(--green)}
svg.ch{width:100%;height:auto;display:block;margin-bottom:4px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.mx td.pick{background:var(--greenbg);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--green)}
.mx td.low{color:var(--green);font-weight:700}
.mx td div+div{margin-top:2px}
.q-inp{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:15px;background:#fff}
.q-inp:focus{outline:2px solid #8cc4ff;border-color:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:300}
.toast.show{opacity:1}.toast.err{background:var(--red)}
.mbg{position:fixed;inset:0;background:rgba(31,35,40,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:200}
.mbg.on{display:flex}
.modal{background:#fff;border-radius:8px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:16px}
.modal h3{margin-bottom:10px}

@media(max-width:900px){.hg{grid-template-columns:1fr 1fr}.hg .fg:nth-child(2){grid-column:1/-1}.hg .fg:last-child{grid-column:1/-1}}
@media(max-width:720px){
  .wrap{padding:10px 8px 60px}
  .top-in{gap:8px;padding:0 8px}
  .sheet{max-height:none}
  .et{min-width:0}
  .et thead{display:none}
  .et,.et tbody{display:block}
  .et tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-bottom:2px solid var(--line)}
  .et td{display:block;border:0;padding:0}
  .et td::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:1px}
  .et td.rd,.et td.x{width:auto;text-align:left}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="ttl">🛒 平日購物比價</div>
  <div class="nav" id="nav">
    <button data-t="log" class="on">比價紀錄</button>
    <button data-t="query">價格查詢</button>
    <button data-t="remind">採買提醒<span class="cnt" id="remCnt" style="display:none">0</span></button>
  </div>
  <a href="index.html">← 1F 大事記</a>
  <div class="sync"><span class="dot wait" id="dot"></span><span id="syncText">連線中…</span></div>
</div></div>

<div class="wrap">
  <div class="banner" id="banner"><div>🔔 <b id="bannerText"></b></div><span>查看 ›</span></div>

  <!-- 比價紀錄 -->
  <div class="panel on" id="p-log">
    <div class="ed" id="ed">
      <div class="ed-h"><span id="edTitle">新增比價單</span><button class="btn sm" id="edClose">✕ 關閉</button></div>
      <div class="ed-b">
        <div class="hg">
          <div class="fg"><label>查價日期</label><input type="date" id="e-date"></div>
          <div class="fg"><label>商品</label><input type="text" id="e-item" list="dl-items" placeholder="例如：洗衣精" autocomplete="off"></div>
          <div class="fg"><label>規格／容量</label><input type="text" id="e-spec" list="dl-specs" placeholder="例如：2000ml" autocomplete="off"></div>
          <div class="fg"><label>數量</label><input type="number" id="e-qty" min="0" step="any" inputmode="decimal" value="1"></div>
          <div class="fg"><label>預估使用週期（天）</label><input type="number" id="e-cycle" min="0" step="1" inputmode="numeric" placeholder="不追蹤可留空"></div>
          <div class="fg"><label>備註</label><input type="text" id="e-memo" maxlength="60"></div>
        </div>
        <div class="hint" id="e-hint"></div>

        <div class="et-wrap"><table class="et">
          <thead><tr>
            <th>比價平台</th><th>蝦皮註記</th><th>單價</th><th>總價</th><th>折扣方式</th><th>折扣金額</th><th>支付金額</th><th>實付單價</th><th>備註（運費、規格差異…）</th><th class="c">✔ 購買</th><th></th>
          </tr></thead>
          <tbody id="e-body"></tbody>
        </table></div>
        <div class="ed-f">
          <button class="btn sm" id="addRow">＋ 加一列</button>
          <button class="btn sm" id="addAll">＋ 帶入全部平台</button>
          <button class="btn sm" id="clrBuy">清除購買選擇（尚未決定）</button>
          <span class="sp sum">支付金額預設＝數量×單價−折扣，可手動改；每列都填一個平台報價，最後只勾選一個「購買」。</span>
          <button class="btn" id="edCancel">取消</button>
          <button class="btn pri" id="edSave">💾 儲存比價單</button>
        </div>
      </div>
    </div>

    <div class="tool">
      <button class="btn pri" id="btnNew">＋ 新增比價單</button>
      <input type="search" id="l-q" placeholder="搜尋商品／規格／備註">
      <select id="l-p"><option value="">購買平台：全部</option></select>
      <select id="l-s"><option value="">狀態：全部</option><option value="bought">已下單</option><option value="open">尚未決定</option></select>
      <span class="grow sum" id="l-sum"></span>
      <button class="btn" id="btnCsv">⬇ 匯出 CSV</button>
    </div>
    <div class="sheet"><table class="g">
      <thead><tr>
        <th>查價日期</th><th>商品</th><th>規格</th><th class="num">數量</th>
        <th>比價平台</th><th class="num">單價</th><th class="num">總價</th><th>折扣方式</th><th class="num">折扣金額</th><th class="num">支付金額</th><th class="num">實付單價</th><th class="num">與最低價差</th><th class="c">購買</th><th>備註</th><th class="num">週期(天)</th><th></th>
      </tr></thead>
      <tbody id="l-body"></tbody>
    </table></div>
  </div>

  <!-- 價格查詢 -->
  <div class="panel" id="p-query">
    <input class="q-inp" type="search" id="q-in" list="dl-items" placeholder="🔍 輸入部分商品名稱，例如：洗衣　（留空顯示全部商品總覽）" autocomplete="off">
    <div class="hint" style="margin-bottom:12px">價格皆為「折扣後實付單價」＝支付金額 ÷ 數量。</div>
    <div id="q-out"></div>
  </div>

  <!-- 提醒 -->
  <div class="panel" id="p-remind">
    <div id="r-act"></div>
    <div class="sec">追蹤中的商品（尚未進入 14 天提醒期，或已取消提醒）</div>
    <div class="sheet"><table class="g">
      <thead><tr><th>商品</th><th>規格</th><th>上次購買日</th><th>購買平台</th><th class="num">週期(天)</th><th>預計用完</th><th>開始提醒</th><th>狀態</th></tr></thead>
      <tbody id="r-body"></tbody>
    </table></div>
  </div>
</div>

<datalist id="dl-items"></datalist><datalist id="dl-specs"></datalist><datalist id="dl-shops"></datalist>

<div class="mbg" id="rm"><div class="modal">
  <h3>🔔 該補貨了</h3><div id="rm-body"></div>
  <div style="margin-top:8px"><button class="btn" id="rm-close">先關閉（提醒仍保留）</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-JV7IFk4wRtNG3C5ugrqSO-h98xVZ37M",
  authDomain: "glaude-finance-tracker-1f.firebaseapp.com",
  projectId: "glaude-finance-tracker-1f",
  storageBucket: "glaude-finance-tracker-1f.firebasestorage.app",
  messagingSenderId: "551294320640",
  appId: "1:551294320640:web:caec827a871f18a25898e5",
  measurementId: "G-FCW04KDJQ0"
};
const COL='cprices_cases', COL_DIS='cprices_dismissed', REMIND_DAYS=14;
const PLATFORMS=['PCHOME','MOMO','家樂福','蝦皮','全聯','康是美','屈臣氏','寶雅'];
const PF_COLOR={PCHOME:'#2563eb',MOMO:'#be3a7a',家樂福:'#0e7490',蝦皮:'#ea580c',全聯:'#15803d',康是美:'#7c3aed',屈臣氏:'#0d9488',寶雅:'#b45309'};
const DISCOUNTS=['無','優惠券','滿額折','點數回饋','會員價','促銷活動','其他'];

let db=null, cases=[], dismissed={}, editingId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=n=>(n==null||!isFinite(n))?'-':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const toUTC=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const addDays=(s,n)=>{const d=new Date(toUTC(s)+n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const daysBetween=(a,b)=>Math.round((toUTC(b)-toUTC(a))/864e5);
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,'');
const keyOf=c=>norm(c.item)+'||'+norm(c.spec);
const cmpCase=(a,b)=>(a.date<b.date?-1:a.date>b.date?1:0)||((a.createdMs||0)-(b.createdMs||0));
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'k'+(h>>>0).toString(16)};
const bought=c=>c.buyIndex>=0&&c.quotes[c.buyIndex]?c.quotes[c.buyIndex]:null;
const pfLabel=q=>q.platform+(q.note?`・${q.note}`:'');
const dmText=q=>q.discountMethod==='其他'&&q.discountNote?`其他：${q.discountNote}`:(q.discountMethod||'無');
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2600)}
function setSync(s,t){$('dot').className='dot '+(s==='ok'?'':s==='off'?'off':'wait');$('syncText').textContent=t}

/* ===== Firestore ===== */
async function initFirebase(){
  try{
    db=getFirestore(initializeApp(firebaseConfig));
    await loadAll(); setSync('ok','已連線');
  }catch(e){console.error(e);setSync('off','連線失敗');toast('Firebase 連線失敗：'+e.message,true)}
}
async function loadAll(){
  const [a,b]=await Promise.all([getDocs(collection(db,COL)),getDocs(collection(db,COL_DIS))]);
  cases=a.docs.map(d=>{const x=d.data();return {...x,id:d.id,quotes:x.quotes||[],buyIndex:x.buyIndex??-1,createdMs:x.createdAt?.toMillis?.()||0}});
  dismissed={}; b.docs.forEach(d=>dismissed[d.id]=d.data());
  renderAll();
}

/* ===== 編輯器 ===== */
const platOpts=sel=>'<option value="">選擇平台</option>'+PLATFORMS.map(p=>`<option${p===sel?' selected':''}>${p}</option>`).join('');
const dmOpts=sel=>DISCOUNTS.map(p=>`<option${p===(sel||'無')?' selected':''}>${p}</option>`).join('');
function addRow(q={}){
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td data-l="比價平台"><select class="q-pf">${platOpts(q.platform)}</select></td>
    <td data-l="蝦皮註記"><input class="q-note" maxlength="10" list="dl-shops" placeholder="直營／店家" value="${esc(q.note||'')}"></td>

function rowUI(tr){
  const shopee=tr.querySelector('.q-pf').value==='蝦皮';

function rowCalc(tr){
  const qty=num($('e-qty').value), unit=tr.querySelector('.q-unit'), da=num(tr.querySelector('.q-da').value);
  const hasU=unit.value!=='';
  const total=r2(qty*num(unit.value));
  tr.querySelector('.q-total').value=hasU?money(total):'';
  const paidEl=tr.querySelector('.q-paid');
  if(!tr.dataset.manual) paidEl.value=hasU?r2(Math.max(total-da,0)):'';
  tr.querySelector('.q-net').value=(qty>0&&paidEl.value!=='')?money(r2(num(paidEl.value)/qty)):'';
}

async function saveCase(){
  if(!db) return toast('尚未連線 Firebase',true);
  const date=$('e-date').value, item=$('e-item').value.trim(), qty=num($('e-qty').value);
  if(!date) return toast('請選擇查價日期',true);
  if(!item) return toast('請輸入商品',true);
  if(!(qty>0)) return toast('數量需大於 0',true);
  const quotes=[]; let buyIndex=-1, bad='';
  allRows().forEach((tr,i)=>{
    const pf=tr.querySelector('.q-pf').value, u=tr.querySelector('.q-unit').value;
    const isBuy=tr.querySelector('.q-buy').checked;
    if(!pf&&u===''){ if(isBuy) bad='勾選購買的那一列沒有填資料'; return; }
    if(!pf){bad=`第 ${i+1} 列請選擇比價平台`;return}
    if(u===''){bad=`第 ${i+1} 列（${pf}）請輸入單價`;return}
    const unit=num(u), da=num(tr.querySelector('.q-da').value), total=r2(qty*unit);
    const pv=tr.querySelector('.q-paid').value; const paid=pv===''?Math.max(total-da,0):num(pv);
    const dm=tr.querySelector('.q-dm').value;
    quotes.push({platform:pf,note:pf==='蝦皮'?tr.querySelector('.q-note').value.trim():'',unitPrice:unit,total,
      discountMethod:dm,discountNote:dm==='其他'?tr.querySelector('.q-dn').value.trim():'',discountAmount:da,paid,netUnit:r2(paid/qty),
      remark:tr.querySelector('.q-rm').value.trim()});
    if(isBuy) buyIndex=quotes.length-1;
  });
  if(bad) return toast(bad,true);
  if(!quotes.length) return toast('請至少填一個平台的報價',true);
  const cy=parseInt($('e-cycle').value,10);
  const data={date,item,spec:$('e-spec').value.trim(),qty,cycleDays:cy>0?cy:null,memo:$('e-memo').value.trim(),quotes,buyIndex};
  $('edSave').disabled=true;
  try{
    if(editingId){
      await updateDoc(doc(db,COL,editingId),data);
      const i=cases.findIndex(c=>c.id===editingId); cases[i]={...cases[i],...data}; toast('已更新比價單');
    }else{
      const ref=await addDoc(collection(db,COL),{...data,createdAt:Timestamp.now()});
      cases.push({...data,id:ref.id,createdMs:Date.now()});
      toast(buyIndex>=0?'已儲存（同商品的舊提醒已自動解除）':'已儲存（尚未決定購買平台）');
    }
    closeEditor(); renderAll();
  }catch(e){console.error(e);toast('儲存失敗：'+e.message,true)}
  finally{$('edSave').disabled=false}
}

/* ===== 價格查詢 ===== */
function trendChart(list){
  const cs=[...list].sort(cmpCase); const pts=[];
  cs.forEach(c=>c.quotes.forEach((q,i)=>pts.push({d:c.date,v:q.netUnit,p:q.platform,n:q.note,buy:i===c.buyIndex})));
  const W=760,H=270,L=58,R=18,T=14,B=34;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v)); if(lo===hi){lo*=.9;hi=hi*1.1+1}
  const pd=(hi-lo)*.12; lo=Math.max(0,lo-pd); hi+=pd;
  const t0=toUTC(cs[0].date),t1=toUTC(cs[cs.length-1].date);
  const X=d=>t0===t1?L+(W-L-R)/2:L+(toUTC(d)-t0)/(t1-t0)*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g=''; for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e4e8ec"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#656d76">${money(r2(v))}</text>`}
  const bp=pts.filter(p=>p.buy);
  const line=bp.length>1?`<path d="${bp.map((p,i)=>`${i?'L':'M'}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ')}" fill="none" stroke="#1a7f4b" stroke-width="2" stroke-dasharray="5 3"/>`:'';
  const dots=pts.filter(p=>!p.buy).map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5" fill="#fff" stroke="${PF_COLOR[p.p]||'#666'}" stroke-width="2"><title>${p.d}　報價 ${p.p}${p.n?'（'+p.n+'）':''}　NT$${money(p.v)}</title></circle>`).join('')
    +bp.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="7.5" fill="${PF_COLOR[p.p]||'#666'}" stroke="#1a7f4b" stroke-width="3"><title>${p.d}　✔購買 ${p.p}${p.n?'（'+p.n+'）':''}　NT$${money(p.v)}</title></circle>`).join('');
  const one=cs.length===1;
  const xt=(one?[cs[0]]:[cs[0],cs[cs.length-1]]).map((c,i)=>`<text x="${X(c.date)}" y="${H-10}" text-anchor="${one?'middle':i?'end':'start'}" font-size="12" fill="#656d76">${c.date}</text>`).join('');
  const used=[...new Set(pts.map(p=>p.p))];
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="價格趨勢">${g}${line}${dots}${xt}</svg>
  <div class="lg"><span>● 實心粗框＝購買價（綠色虛線連接）　○ 空心＝其他平台報價</span>${used.map(p=>`<span><i style="background:${PF_COLOR[p]||'#666'}"></i>${p}</span>`).join('')}</div>`;
}
function groups(kw){
  const m={}; cases.forEach(c=>{ if(kw&&!norm(c.item+c.spec).includes(kw)) return; (m[keyOf(c)]||(m[keyOf(c)]=[])).push(c); });
  return Object.values(m).sort((a,b)=>Math.max(...b.map(c=>toUTC(c.date)))-Math.max(...a.map(c=>toUTC(c.date))));
}

        if(!qs.length) return '<td class="num sub">—</td>';
        const pick=qs.some(x=>x.i===c.buyIndex), low=c.quotes.length>1&&qs.some(x=>x.q.netUnit===mn);
        return `<td class="num ${pick?'pick':''} ${low&&!pick?'low':''}">${qs.map(x=>`<div>${money(x.q.netUnit)}${x.q.note?`<span class="sub"> ${esc(x.q.note)}</span>`:''}</div>`).join('')}</td>`;
      }).join('');
      return `<tr><td>${c.date}</td><td class="num">${money(c.qty)}</td>${cells}<td>${bought(c)?esc(pfLabel(bought(c))):'<span class="mark mk-none">未決定</span>'}</td></tr>`;
    }).join('');
    return `<div class="card"><div class="card-h"><span>${esc(last.item)}</span>${last.spec?`<span class="tag">${esc(last.spec)}</span>`:''}<span class="sub">${g.length} 次比價・${s[0].date} ～ ${last.date}</span></div>
      <div class="card-b">${kpi}${trendChart(g)}
      <div class="sec">各平台報價統計（依平均報價由低到高）</div>
      <div class="sheet" style="max-height:none"><table class="g"><thead><tr><th>平台</th><th class="num">報價次數</th><th class="num">平均實付單價</th><th class="num">最低實付單價</th><th class="num">當次最低次數</th><th class="num">被選中購買</th></tr></thead><tbody>${prow}</tbody></table></div>
      <div class="sec">歷次比價對照表（實付單價；綠底＝最後購買，綠字＝當次最低）</div>
      <div class="sheet mx" style="max-height:none"><table class="g mx"><thead><tr><th>日期</th><th class="num">數量</th>${plats.map(p=>`<th class="num">${p}</th>`).join('')}<th>購買平台</th></tr></thead><tbody>${mrows}</tbody></table></div>
      </div></div>`;
  }).join('');
}

/* ===== 提醒 ===== */
function computeRem(){
  const latest={}; cases.filter(bought).forEach(c=>{const k=keyOf(c); if(!latest[k]||cmpCase(c,latest[k])>0) latest[k]=c});
  const today=todayStr();
  return Object.entries(latest).filter(([,c])=>c.cycleDays>0).map(([k,c])=>{
    const due=addDays(c.date,c.cycleDays), from=addDays(due,-REMIND_DAYS), diff=daysBetween(today,due), dis=!!dismissed[c.id];
    return {c,due,from,diff,dis,active:today>=from&&!dis};
  }).sort((a,b)=>a.diff-b.diff);
}
const stTxt=x=>x.diff<0?`已逾期 ${-x.diff} 天`:x.diff===0?'今天用完':`還剩 ${x.diff} 天`;
function remCard(x){
  const c=x.c,b=bought(c);
  return `<div class="rem ${x.diff<0?'over':''}"><div><div class="t">${esc(c.item)}${c.spec?`（${esc(c.spec)}）`:''}　<span class="mark ${x.diff<0?'mk-diff':'mk-none'}">${stTxt(x)}</span></div>
    <div class="m">上次購買 ${c.date}（${esc(pfLabel(b))}・實付單價 ${money(b.netUnit)}）・週期 ${c.cycleDays} 天・預計用完 ${x.due}</div></div>
    <div class="b"><button class="btn sm pri" data-a="rebuy" data-id="${c.id}">🛒 開始比價</button><button class="btn sm" data-a="dis" data-id="${c.id}">取消提醒</button></div></div>`;
}
function renderRem(){
  const all=computeRem(), act=all.filter(x=>x.active);
  $('r-act').innerHTML=act.length?act.map(remCard).join(''):'<div class="card"><div class="empty">目前沒有需要補貨的商品</div></div>';
  $('r-body').innerHTML=all.filter(x=>!x.active).map(x=>`<tr><td><b>${esc(x.c.item)}</b></td><td>${esc(x.c.spec||'')}</td><td>${x.c.date}</td><td>${esc(pfLabel(bought(x.c)))}</td><td class="num">${x.c.cycleDays}</td><td>${x.due}</td><td>${x.from}</td><td>${x.dis?'<span class="mark mk-low">已取消提醒</span>':stTxt(x)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">沒有追蹤中的商品（比價單填「預估使用週期」並勾選購買後即會追蹤）</td></tr>';
  const cn=$('remCnt'); cn.textContent=act.length; cn.style.display=act.length?'':'none';
  const b=$('banner');
  if(act.length){b.style.display='flex';const ov=act.filter(x=>x.diff<0).length;$('bannerText').textContent=`${act.length} 項商品該補貨了${ov?`（${ov} 項已逾期）`:''}：`+act.slice(0,3).map(x=>x.c.item).join('、')+(act.length>3?' …':'')}
  else b.style.display='none';
  return act;
}
function showModal(act){ if(!act.length) return; $('rm-body').innerHTML=act.map(remCard).join(''); $('rm').classList.add('on'); }
async function dismissRem(id){
  try{
    await setDoc(doc(db,COL_DIS,id),{caseId:id,at:Timestamp.now()}); dismissed[id]={caseId:id};
    renderAll(); const act=computeRem().filter(x=>x.active); if(act.length) showModal(act); else $('rm').classList.remove('on'); toast('已取消提醒');
  }catch(e){toast('操作失敗：'+e.message,true)}
}
function rebuy(id){
  const c=cases.find(x=>x.id===id); if(!c) return;
  $('rm').classList.remove('on'); switchTab('log');
  openEditor({date:todayStr(),item:c.item,spec:c.spec,qty:c.qty,cycleDays:c.cycleDays,memo:'',buyIndex:-1,quotes:c.quotes.map(q=>({platform:q.platform,note:q.note}))});
  toast('已帶入上次比價的平台，請填入這次的價格');
}

/* ===== 版面與事件 ===== */
function switchTab(t){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
}
function renderAll(){ refreshDatalists(); renderList(); renderQuery(); renderRem(); }

$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchTab(b.dataset.t)});
$('banner').addEventListener('click',()=>switchTab('remind'));
$('rm-close').addEventListener('click',()=>$('rm').classList.remove('on'));
$('rm').addEventListener('click',e=>{if(e.target===$('rm'))$('rm').classList.remove('on')});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b){const a=b.dataset.a; if(a==='edit')openEditor(cases.find(c=>c.id===b.dataset.id)); else if(a==='del')delCase(b.dataset.id); else if(a==='dis')dismissRem(b.dataset.id); else if(a==='rebuy')rebuy(b.dataset.id); return}
  const q=e.target.closest('tr[data-q]'); if(q){$('q-in').value=q.dataset.q;renderQuery();window.scrollTo({top:0,behavior:'smooth'})}
});
$('btnNew').addEventListener('click',()=>openEditor(null));
$('edClose').addEventListener('click',closeEditor); $('edCancel').addEventListener('click',closeEditor);
$('edSave').addEventListener('click',saveCase);
$('addRow').addEventListener('click',()=>addRow());
$('addAll').addEventListener('click',()=>{const have=new Set(allRows().map(tr=>tr.querySelector('.q-pf').value));
  const empty=allRows().filter(tr=>!tr.querySelector('.q-pf').value&&tr.querySelector('.q-unit').value==='');empty.forEach(tr=>tr.remove());
  PLATFORMS.filter(p=>!have.has(p)).forEach(p=>addRow({platform:p}))});
$('clrBuy').addEventListener('click',()=>{allRows().forEach(tr=>{tr.querySelector('.q-buy').checked=false;rowUI(tr)})});
$('e-body').addEventListener('input',e=>{
  const tr=e.target.closest('tr'); if(!tr) return;
  if(e.target.classList.contains('q-paid')) tr.dataset.manual='1';
  if(e.target.classList.contains('q-unit')||e.target.classList.contains('q-da')){ if(e.target.classList.contains('q-unit')&&!tr.dataset.manual){} }
  rowCalc(tr);
});
$('e-body').addEventListener('change',e=>{const tr=e.target.closest('tr');if(!tr)return;rowUI(tr);rowCalc(tr)});
$('e-body').addEventListener('click',e=>{
  if(e.target.closest('.q-del')){const tr=e.target.closest('tr');tr.remove();if(!allRows().length)addRow();}
  if(e.target.classList.contains('q-buy')) allRows().forEach(rowUI);
});
$('e-qty').addEventListener('input',()=>allRows().forEach(rowCalc));
$('e-item').addEventListener('input',()=>{refreshDatalists();updateHint()});
$('e-item').addEventListener('change',()=>{prefillFromHistory();refreshDatalists();updateHint()});
$('l-q').addEventListener('input',renderList); $('l-p').addEventListener('change',renderList); $('l-s').addEventListener('change',renderList);
$('btnCsv').addEventListener('click',exportCsv); $('q-in').addEventListener('input',renderQuery);
$('l-p').innerHTML='<option value="">購買平台：全部</option>'+PLATFORMS.map(p=>`<option>${p}</option>`).join('');

await initFirebase();
showModal(computeRem().filter(x=>x.active));
</script>
</body>
