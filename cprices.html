<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>平日購物比價｜1F 大事記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBF2;--surface:#FFF6E8;--card:#FFFFFF;--border:#EDDCBE;
  --accent:#D97757;--accent2:#7FA88F;--danger:#D9684F;--warn:#D9A23B;
  --text:#4A3F35;--muted:#8C7A63;--good:#6B9080;--blue:#4C8FB0;
  --shadow:0 2px 10px rgba(180,140,90,.10);--shadow-lg:0 10px 32px rgba(180,140,90,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 1px 1px,rgba(217,119,87,.05) 1px,transparent 0);background-size:22px 22px;
  padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.topbar{background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:'Fredoka',sans-serif;font-size:21px;font-weight:600;color:var(--accent)}
.brand small{display:block;font-family:'Noto Sans TC';font-size:13px;color:var(--muted);font-weight:500}
.back{font-size:15px;font-weight:600;color:var(--muted)}
.back:hover{color:var(--accent)}
.sync{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent2)}
.dot.off{background:var(--danger)}
.dot.wait{background:var(--warn)}

.tabs{display:flex;gap:5px;margin:16px 0;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:6px;overflow-x:auto}
.tab{appearance:none;-webkit-appearance:none;padding:11px 20px;border-radius:16px;cursor:pointer;font-size:16px;color:var(--muted);border:none;background:transparent;font-family:inherit;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab.active{background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.tab .cnt{background:var(--danger);color:#fff;border-radius:12px;font-size:12px;padding:1px 8px;min-width:22px;text-align:center}
.tab.active .cnt{background:#fff;color:var(--accent)}
.panel{display:none}.panel.active{display:block}

.banner{background:#FBEDD9;border:1.5px solid #EBCB93;border-radius:16px;padding:12px 16px;margin-bottom:14px;display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;cursor:pointer}
.banner b{color:#9a6a12}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-family:'Fredoka','Noto Sans TC',sans-serif;font-size:19px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.fg{display:flex;flex-direction:column;gap:6px;min-width:0}
.fg.full{grid-column:1/-1}
label,.lbl{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em}
input,select,textarea{background:var(--card);border:1.5px solid var(--border);border-radius:11px;color:var(--text);padding:11px 13px;font-size:16px;font-family:inherit;outline:none;width:100%;transition:.15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.13)}
input[readonly]{background:var(--surface)}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--border);border-radius:20px;cursor:pointer;font-size:15px;font-weight:600;color:var(--muted);background:var(--card);user-select:none}
.chip input{width:auto;accent-color:var(--accent)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(217,119,87,.07)}
.note-row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.note-row span{font-size:13px;color:var(--muted);font-weight:700}
.note-row input{max-width:260px}
.paid-box{background:var(--surface);border:1.5px dashed var(--border);border-radius:14px;padding:12px 14px}

.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;gap:6px;padding:12px 22px;border-radius:22px;border:none;cursor:pointer;font-size:16px;font-family:inherit;font-weight:700;transition:.18s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #B85A3D}
.btn-primary:hover{background:#C76847}
.btn-ghost{background:var(--card);color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.btn-ok{background:var(--accent2);color:#fff}
.btn-danger{background:#FBE9E3;color:var(--danger);border:1.5px solid #F3CDBE}
.btn-sm{padding:7px 13px;font-size:14px;border-radius:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:15px}
thead{background:var(--surface)}
th{padding:11px 12px;text-align:left;font-weight:700;color:var(--muted);font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
td.wrapc{white-space:normal;min-width:120px}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:14px;font-size:12px;font-weight:700;background:#E7F0E9;color:var(--good)}
.badge.warn{background:#FBEDD9;color:#9a6a12}
.badge.err{background:#FBE9E3;color:var(--danger)}
.badge.blue{background:#E1ECF7;color:#1f5c8c}
.pf{display:inline-block;padding:2px 9px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;margin:1px 3px 1px 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:150px}
.toolbar .sp{flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:34px 10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-family:'Archivo Black','Fredoka',sans-serif;font-size:22px}
.stat .s{font-size:13px;color:var(--muted)}
.up{color:var(--danger)}.down{color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 2px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}

.rem{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px solid #EBCB93;background:#FFF8EA;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rem.over{border-color:#F3CDBE;background:#FEF1EC}
.rem .t{font-weight:700;font-size:17px}
.rem .m{font-size:14px;color:var(--muted)}
.sec-title{font-weight:700;color:var(--muted);font-size:14px;margin:18px 0 8px}

.modal-bg{position:fixed;inset:0;background:rgba(74,63,53,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:22px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-lg)}
.modal h3{font-family:'Fredoka','Noto Sans TC';font-size:20px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 22px;border-radius:22px;opacity:0;pointer-events:none;transition:.25s;z-index:300;font-weight:600;font-size:15px}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--danger)}

@media(max-width:720px){
  body{font-size:16px}
  .wrap{padding:0 12px 60px}
  .topbar-in{padding:8px 12px}
  .card{padding:16px;border-radius:16px}
  .grid{grid-template-columns:1fr 1fr}
  .fg.full{grid-column:1/-1}
  .tab{padding:10px 14px;font-size:15px}
  .toolbar input,.toolbar select{min-width:100%}
  .btn{padding:12px 18px}
}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <div>
    <div class="brand">🛒 平日購物比價<small>1F 大事記</small></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <a class="back" href="index.html">← 回 1F 大事記</a>
    <div class="sync"><span class="dot wait" id="dot"></span><span id="syncText">連線中…</span></div>
  </div>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="form">✏️ 新增紀錄</button>
    <button class="tab" data-tab="list">📋 所有紀錄</button>
    <button class="tab" data-tab="query">📈 價格查詢</button>
    <button class="tab" data-tab="remind">🔔 採買提醒 <span class="cnt" id="remCnt" style="display:none">0</span></button>
  </div>

  <div class="banner" id="banner"><div>🔔 <b id="bannerText"></b></div><span class="btn btn-sm btn-ghost">查看</span></div>

  <!-- 新增 / 編輯 -->
  <div class="panel active" id="panel-form">
    <div class="card">
      <h2 id="formTitle">新增購物紀錄</h2>
      <div class="grid">
        <div class="fg"><label>購買日期</label><input type="date" id="f-date"></div>
        <div class="fg" style="grid-column:span 2"><label>商品</label>
          <input type="text" id="f-item" list="dl-items" placeholder="例如：洗衣精" autocomplete="off">
          <div class="hint" id="itemHint"></div>
        </div>
        <div class="fg"><label>規格／容量</label><input type="text" id="f-spec" list="dl-specs" placeholder="例如：2000ml、一箱24入" autocomplete="off"></div>
      </div>

      <div class="fg full" style="margin-top:16px">
        <span class="lbl">比價平台（可多選，你這次拿來比較的平台）</span>
        <div class="chips" id="cmpChips"></div>
        <div class="note-row" id="cmpNoteRow" style="display:none">
          <span>蝦皮註記（比價）</span>
          <input type="text" id="f-cmpNote" maxlength="10" list="dl-shops" placeholder="直營 或 店家名稱（約8字）">
        </div>
      </div>

      <div class="grid" style="margin-top:16px">
        <div class="fg"><label>✅ 購買平台（最後決定下單的一個）</label>
          <select id="f-buy"></select>
        </div>
        <div class="fg" id="buyNoteBox" style="display:none"><label>蝦皮註記（購買）</label>
          <input type="text" id="f-buyNote" maxlength="10" list="dl-shops" placeholder="直營 或 店家名稱（約8字）">
        </div>
      </div>

      <div class="grid" style="margin-top:16px">
        <div class="fg"><label>數量</label><input type="number" id="f-qty" min="0" step="any" inputmode="decimal" value="1"></div>
        <div class="fg"><label>單價（NT$）</label><input type="number" id="f-unit" min="0" step="any" inputmode="decimal"></div>
        <div class="fg"><label>總價（自動）</label><input type="text" id="f-total" readonly></div>
        <div class="fg"><label>折扣方式</label><select id="f-dmethod"></select></div>
        <div class="fg" id="dOtherBox" style="display:none"><label>折扣說明</label><input type="text" id="f-dother" maxlength="20" placeholder="例如：信用卡回饋"></div>
        <div class="fg"><label>折扣金額（NT$）</label><input type="number" id="f-damt" min="0" step="any" inputmode="decimal" value="0"></div>
      </div>

      <div class="paid-box" style="margin-top:16px">
        <div class="grid">
          <div class="fg"><label>支付金額（NT$，自動＝總價－折扣，可手動修改）</label><input type="number" id="f-paid" min="0" step="any" inputmode="decimal"></div>
          <div class="fg"><label>折扣後實付單價（自動）</label><input type="text" id="f-net" readonly></div>
          <div class="fg" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" type="button" id="btnAuto">↺ 還原自動計算</button></div>
        </div>
      </div>

      <div class="grid" style="margin-top:16px">
        <div class="fg"><label>預估使用週期（天，選填）</label><input type="number" id="f-cycle" min="0" step="1" inputmode="numeric" placeholder="例如：60"></div>
        <div class="fg" style="grid-column:span 2"><label>備註（選填）</label><input type="text" id="f-memo" maxlength="60"></div>
      </div>
      <div class="hint" style="margin-top:8px">有填使用週期的商品，會在「購買日 + 週期 − 14 天」開始提醒，直到你按「取消提醒」或再次購買同商品為止。</div>

      <div class="actions">
        <button class="btn btn-primary" id="btnSave">💾 儲存紀錄</button>
        <button class="btn btn-ghost" id="btnCancel" style="display:none">取消編輯</button>
        <button class="btn btn-ghost" id="btnReset">清空表單</button>
      </div>
    </div>
  </div>

  <!-- 所有紀錄 -->
  <div class="panel" id="panel-list">
    <div class="toolbar">
      <input type="search" id="l-search" placeholder="🔍 搜尋商品／規格／備註">
      <select id="l-buy"><option value="">全部購買平台</option></select>
      <button class="btn btn-ghost sp" id="btnCsv">⬇ 匯出 CSV</button>
    </div>
    <div class="hint" id="l-sum" style="margin-bottom:8px"></div>
    <div class="tw"><table>
      <thead><tr>
        <th>購買日期</th><th>比價平台</th><th>購買平台</th><th>商品</th><th>規格</th>
        <th class="num">數量</th><th class="num">單價</th><th class="num">總價</th>
        <th>折扣方式</th><th class="num">折扣金額</th><th class="num">支付金額</th><th class="num">實付單價</th><th>週期</th><th></th>
      </tr></thead>
      <tbody id="l-body"></tbody>
    </table></div>
  </div>

  <!-- 價格查詢 -->
  <div class="panel" id="panel-query">
    <div class="card">
      <h2>歷史價格查詢</h2>
      <input type="search" id="q-input" list="dl-items" placeholder="輸入部分商品名稱，例如：洗衣" autocomplete="off">
      <div class="hint" style="margin-top:6px">以「折扣後實付單價」比較；🏆 代表該商品歷史最低。不輸入時顯示全部商品總覽。</div>
    </div>
    <div id="q-result"></div>
  </div>

  <!-- 提醒 -->
  <div class="panel" id="panel-remind">
    <div id="r-active"></div>
    <div class="sec-title">追蹤中（尚未進入 14 天提醒期，或已取消提醒）</div>
    <div class="tw"><table>
      <thead><tr><th>商品</th><th>規格</th><th>上次購買</th><th class="num">週期(天)</th><th>預計用完</th><th>開始提醒</th><th>狀態</th></tr></thead>
      <tbody id="r-body"></tbody>
    </table></div>
  </div>
</div>

<datalist id="dl-items"></datalist>
<datalist id="dl-specs"></datalist>
<datalist id="dl-shops"></datalist>

<!-- 開頁提醒彈窗 -->
<div class="modal-bg" id="remModal"><div class="modal">
  <h3>🔔 該補貨囉！</h3>
  <div id="remModalBody"></div>
  <div class="actions"><button class="btn btn-ghost" id="remModalClose">先關閉（提醒仍保留）</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-JV7IFk4wRtNG3C5ugrqSO-h98xVZ37M",
  authDomain: "glaude-finance-tracker-1f.firebaseapp.com",
  projectId: "glaude-finance-tracker-1f",
  storageBucket: "glaude-finance-tracker-1f.firebasestorage.app",
  messagingSenderId: "551294320640",
  appId: "1:551294320640:web:caec827a871f18a25898e5",
  measurementId: "G-FCW04KDJQ0"
};

const COL = 'cprices';                 // 購物紀錄
const COL_DISMISS = 'cprices_dismissed'; // 已取消的提醒
const REMIND_DAYS = 14;
const PLATFORMS = ['PCHOME','MOMO','家樂福','蝦皮','全聯','康是美','屈臣氏','寶雅'];
const PF_COLOR = {PCHOME:'#4C8FB0',MOMO:'#C25D8A',家樂福:'#3F6FB5',蝦皮:'#E8803A',全聯:'#6B9080',康是美:'#8F6BB5',屈臣氏:'#2FA39A',寶雅:'#D9A23B'};
const DISCOUNTS = ['無','優惠券','滿額折','點數回饋','會員價','促銷活動','其他'];

let db = null;
let records = [];            // 全部紀錄
let dismissed = {};          // hash -> {recordId}
let editingId = null;
let paidManual = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const money = n => { if(n==null||!isFinite(n)) return '-'; return Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}); };
const round2 = n => Math.round(n*100)/100;

/* ---------- 日期 ---------- */
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const toUTC = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const addDays = (s,n) => { const d=new Date(toUTC(s)+n*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const daysBetween = (a,b) => Math.round((toUTC(b)-toUTC(a))/864e5);

/* ---------- 工具 ---------- */
const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,'');
const itemKey = r => norm(r.item) + '||' + norm(r.spec);
const hash = s => { let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'k'+(h>>>0).toString(16)+'_'+s.length; };
const cmpRec = (a,b) => (a.date<b.date?-1:a.date>b.date?1:0) || ((a.createdMs||0)-(b.createdMs||0));
const pfTag = (p,note) => p ? `<span class="pf" style="background:${PF_COLOR[p]||'#999'}">${esc(p)}${note?'・'+esc(note):''}</span>` : '-';
const cmpText = r => (r.comparePlatforms||[]).map(c=>c.p+(c.note?`（${c.note}）`:'')).join('、');
function toast(msg, err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(()=>t.className='toast',2600); }
function setSync(state,text){ $('dot').className='dot '+(state==='ok'?'':state==='off'?'off':'wait'); $('syncText').textContent=text; }

/* ---------- Firestore ---------- */
async function initFirebase(){
  try{
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    await loadAll();
    setSync('ok','已連線');
  }catch(e){
    console.error(e);
    setSync('off','連線失敗');
    toast('Firebase 連線失敗：'+e.message, true);
  }
}
async function loadAll(){
  const [s1,s2] = await Promise.all([getDocs(collection(db,COL)), getDocs(collection(db,COL_DISMISS))]);
  records = s1.docs.map(d=>{ const x=d.data(); return {...x, id:d.id, createdMs: x.createdAt?.toMillis?.() || 0}; });
  dismissed = {};
  s2.docs.forEach(d=>{ dismissed[d.id] = d.data(); });
  renderAll();
}

function selectedCompare(){

function calc(){
  const q=num($('f-qty').value), u=num($('f-unit').value), d=num($('f-damt').value);
  const total = round2(q*u);
  $('f-total').value = $('f-unit').value==='' ? '' : money(total);
  if(!paidManual) $('f-paid').value = $('f-unit').value==='' ? '' : round2(Math.max(total-d,0));
  const paid = num($('f-paid').value);
  $('f-net').value = (q>0 && $('f-paid').value!=='') ? money(round2(paid/q)) : '';

function updateItemHint(){
  const name = norm($('f-item').value);
  const hint = $('itemHint');
  if(!name){ hint.innerHTML=''; return; }
  const specN = norm($('f-spec').value);
  let list = records.filter(r=>norm(r.item)===name);
  if(specN) { const l2 = list.filter(r=>norm(r.spec)===specN); if(l2.length) list=l2; }
  if(!list.length){ hint.innerHTML='新商品（尚無歷史紀錄）'; return; }
  list.sort(cmpRec);
  const last = list[list.length-1];
  const min = list.reduce((a,b)=>b.netUnit<a.netUnit?b:a);
  hint.innerHTML = `上次：<b>NT$${money(last.netUnit)}</b>（${esc(last.buyPlatform)}・${last.date}）　歷史最低：<b>NT$${money(min.netUnit)}</b>（${esc(min.buyPlatform)}）`;

function fillFromLatest(){
  const name = norm($('f-item').value);

  const list = records.filter(r=>norm(r.item)===name).sort(cmpRec);
  if(!list.length) return;
  const last = list[list.length-1];
  if(!$('f-spec').value) $('f-spec').value = last.spec||'';

}

/* ---------- 儲存 ---------- */
async function save(){
  if(!db){ toast('尚未連線 Firebase', true); return; }
  const date=$('f-date').value, item=$('f-item').value.trim(), buy=$('f-buy').value;
  const qty=num($('f-qty').value), unit=num($('f-unit').value);
  if(!date) return toast('請選擇購買日期', true);
  if(!item) return toast('請輸入商品', true);
  if(!buy) return toast('請選擇購買平台', true);
  if(!(qty>0)) return toast('數量需大於 0', true);
  if($('f-unit').value==='') return toast('請輸入單價', true);
  const total = round2(qty*unit);
  const damt = num($('f-damt').value);
  const paid = $('f-paid').value==='' ? Math.max(total-damt,0) : num($('f-paid').value);
  const method = $('f-dmethod').value;
  const cycle = parseInt($('f-cycle').value,10);
  const buyNote = buy==='蝦皮' ? $('f-buyNote').value.trim() : '';
  const data = {
    date, item, spec:$('f-spec').value.trim(),
    comparePlatforms: selectedCompare(),
    buyPlatform: buy, buyNote,
    qty, unitPrice: unit, total,
    discountMethod: method, discountNote: method==='其他' ? $('f-dother').value.trim() : '',
    discountAmount: damt, paid, netUnit: round2(paid/qty),
    cycleDays: cycle>0 ? cycle : null,
    memo: $('f-memo').value.trim()
  };
  $('btnSave').disabled = true;
  try{
    if(editingId){
      await updateDoc(doc(db,COL,editingId), data);
      const i = records.findIndex(r=>r.id===editingId);
      records[i] = {...records[i], ...data};
      toast('已更新紀錄');
    }else{
      const ref = await addDoc(collection(db,COL), {...data, createdAt: Timestamp.now()});
      records.push({...data, id:ref.id, createdMs:Date.now()});
      toast('已儲存紀錄（同商品的舊提醒已自動解除）');
    }
    resetForm(); renderAll();
  }catch(e){
    console.error(e); toast('儲存失敗：'+e.message, true);
  }finally{ $('btnSave').disabled=false; }
}

function startEdit(id){
  const r = records.find(x=>x.id===id); if(!r) return;

  $('formTitle').textContent = '編輯購物紀錄';

  $('f-buy').value=r.buyPlatform; $('f-buyNote').value=r.buyNote||'';

/* ---------- 價格查詢 ---------- */
function trendChart(list){
  const pts = [...list].sort(cmpRec);
  const W=720,H=260,L=56,R=16,T=14,B=34;
  const ys = pts.map(p=>p.netUnit);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(lo===hi){ lo=lo*0.9; hi=hi*1.1+1; }
  const pad = (hi-lo)*0.12; lo=Math.max(0,lo-pad); hi=hi+pad;
  const t0=toUTC(pts[0].date), t1=toUTC(pts[pts.length-1].date);
  const X = d => pts.length===1||t0===t1 ? (L+(W-L-R)/2) : L+(toUTC(d)-t0)/(t1-t0)*(W-L-R);
  const Y = v => T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4, y=Y(v);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#EDDCBE" stroke-dasharray="3 4"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#8C7A63">${money(round2(v))}</text>`;
  }
  const path = pts.map((p,i)=>`${i?'L':'M'}${X(p.date).toFixed(1)},${Y(p.netUnit).toFixed(1)}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.netUnit).toFixed(1)}" r="6" fill="${PF_COLOR[p.buyPlatform]||'#999'}" stroke="#fff" stroke-width="2"><title>${p.date}　${p.buyPlatform}${p.buyNote?'（'+p.buyNote+'）':''}　實付單價 NT$${money(p.netUnit)}</title></circle>`).join('');
  const xl = pts.length===1 ? [pts[0]] : [pts[0],pts[pts.length-1]];
  const xt = xl.map((p,i)=>`<text x="${X(p.date)}" y="${H-10}" text-anchor="${pts.length===1?'middle':(i?'end':'start')}" font-size="12" fill="#8C7A63">${p.date}</text>`).join('');
  const used = [...new Set(pts.map(p=>p.buyPlatform))];
  const legend = `<div class="legend">${used.map(p=>`<span><i style="background:${PF_COLOR[p]||'#999'}"></i>${p}</span>`).join('')}</div>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="價格趨勢圖">${g}<path d="${path}" fill="none" stroke="#D97757" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xt}</svg>${legend}`;
}
function groupItems(filterKw){
  const groups = {};
  records.forEach(r=>{
    if(filterKw && !norm(r.item+r.spec).includes(filterKw)) return;
    (groups[itemKey(r)] ||= []).push(r);
  });
  return Object.values(groups).sort((a,b)=>{
    const la=Math.max(...a.map(x=>toUTC(x.date))), lb=Math.max(...b.map(x=>toUTC(x.date)));
    return lb-la;
  });
}

    return `<div class="card">

        <div class="stat"><div class="k">平均</div><div class="v">${money(round2(avg))}</div><div class="s">最近 vs 平均 ${last.netUnit<=avg?'偏低':'偏高'}</div></div>
      </div>

      ${pRows.map(x=>`<tr><td>${pfTag(x.p)}${x.avg===bestAvg&&pRows.length>1?' 🏆':''}</td><td class="num">${x.n}</td><td class="num">${money(round2(x.avg))}</td><td class="num">${money(x.min)}</td><td class="num">${money(x.last.netUnit)}（${x.last.date}）</td></tr>`).join('')}
      </tbody></table></div>
      <div class="sec-title">購買明細</div>
      <div class="tw"><table><thead><tr><th>日期</th><th>購買平台</th><th class="num">單價</th><th class="num">數量</th><th>折扣方式</th><th class="num">折扣</th><th class="num">支付</th><th class="num">實付單價</th><th>當時比價平台</th></tr></thead><tbody>${detail}</tbody></table></div>

/* ---------- 提醒 ---------- */
function computeReminders(){
  const latest = {};
  records.forEach(r=>{ const k=itemKey(r); if(!latest[k] || cmpRec(r,latest[k])>0) latest[k]=r; });
  const today = todayStr();
  return Object.entries(latest).filter(([,r])=>r.cycleDays>0).map(([k,r])=>{
    const due = addDays(r.date, r.cycleDays);
    const from = addDays(due, -REMIND_DAYS);
    const diff = daysBetween(today, due);
    const dis = dismissed[hash(k)]?.recordId === r.id;
    return {key:k, r, due, from, diff, dismissed:dis, active: today>=from && !dis};
  }).sort((a,b)=>a.diff-b.diff);
}
const statusText = x => x.diff<0 ? `已逾期 ${-x.diff} 天` : x.diff===0 ? '今天用完' : `還剩 ${x.diff} 天`;
function remCard(x, inModal){

    <div><div class="t">${esc(r.item)}${r.spec?`（${esc(r.spec)}）`:''}　<span class="badge ${x.diff<0?'err':'warn'}">${statusText(x)}</span></div>
    <div class="m">上次購買 ${r.date}・週期 ${r.cycleDays} 天・預計用完 ${x.due}・最近買在 ${esc(r.buyPlatform)}（NT$${money(r.netUnit)}）</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ok btn-sm" data-act="rebuy" data-id="${r.id}">🛒 已採買（新增紀錄）</button>
      <button class="btn btn-ghost btn-sm" data-act="dismiss" data-key="${esc(x.key)}" data-id="${r.id}">取消提醒</button>
    </div></div>`;
}
function renderReminders(){
  const all = computeReminders();
  const act = all.filter(x=>x.active);
  $('r-active').innerHTML = act.length ? act.map(x=>remCard(x)).join('') : '<div class="card empty">🎉 目前沒有需要補貨的商品</div>';
  $('r-body').innerHTML = all.filter(x=>!x.active).map(x=>`<tr><td><b>${esc(x.r.item)}</b></td><td>${esc(x.r.spec||'')}</td><td>${x.r.date}</td><td class="num">${x.r.cycleDays}</td><td>${x.due}</td><td>${x.from}</td>
    <td>${x.dismissed?'<span class="badge">已取消提醒</span>':`<span class="badge blue">${statusText(x)}</span>`}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">沒有追蹤中的商品（新增紀錄時填「預估使用週期」即可追蹤）</td></tr>`;
  const cnt = $('remCnt'); cnt.textContent = act.length; cnt.style.display = act.length ? '' : 'none';
  const b = $('banner');
  if(act.length){
    b.style.display='flex';
    const over = act.filter(x=>x.diff<0).length;
    $('bannerText').textContent = `${act.length} 項商品該補貨了${over?`（其中 ${over} 項已逾期）`:''}：` + act.slice(0,3).map(x=>x.r.item).join('、') + (act.length>3?' …':'');
  }else b.style.display='none';
  return act;
}
function showRemModal(act){
  if(!act.length) return;
  $('remModalBody').innerHTML = act.map(x=>remCard(x,true)).join('');
  $('remModal').classList.add('show');
}
async function dismissRem(key, recordId){
  try{
    const h = hash(key);
    await setDoc(doc(db,COL_DISMISS,h), {key, recordId, at: Timestamp.now()});
    dismissed[h] = {key, recordId};
    renderAll();
    if(!computeReminders().some(x=>x.active)) $('remModal').classList.remove('show');
    else showRemModal(computeReminders().filter(x=>x.active));
    toast('已取消提醒');
  }catch(e){ toast('操作失敗：'+e.message, true); }
}
function rebuy(id){
  const r = records.find(x=>x.id===id); if(!r) return;
  resetForm();
  $('f-item').value=r.item; $('f-spec').value=r.spec||''; $('f-cycle').value=r.cycleDays||'';
  document.querySelectorAll('#cmpChips input').forEach(c=>{ c.checked=(r.comparePlatforms||[]).some(x=>x.p===c.value); });
  const sp=(r.comparePlatforms||[]).find(x=>x.p==='蝦皮'); $('f-cmpNote').value=sp?.note||'';
  syncFormUI(); updateItemHint();
  $('remModal').classList.remove('show');
  switchTab('form'); window.scrollTo({top:0,behavior:'smooth'});
  toast('請填入這次的購買平台與價格');
}

/* ---------- 版面 ---------- */
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+t));
}
function renderAll(){
  refreshDatalists(); renderList(); renderQuery(); renderReminders(); updateItemHint();
}

/* ---------- 事件 ---------- */
$('tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(b) switchTab(b.dataset.tab); });
$('banner').addEventListener('click', ()=>switchTab('remind'));
$('remModalClose').addEventListener('click', ()=>$('remModal').classList.remove('show'));
$('remModal').addEventListener('click', e=>{ if(e.target===$('remModal')) $('remModal').classList.remove('show'); });
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(b){
    const a=b.dataset.act;
    if(a==='edit') startEdit(b.dataset.id);
    else if(a==='del') removeRec(b.dataset.id);
    else if(a==='dismiss') dismissRem(b.dataset.key, b.dataset.id);
    else if(a==='rebuy') rebuy(b.dataset.id);
    return;
  }
  const q = e.target.closest('tr[data-q]'); if(q){ $('q-input').value=q.dataset.q; renderQuery(); window.scrollTo({top:0,behavior:'smooth'}); }
});
['f-qty','f-unit','f-damt'].forEach(i=>$(i).addEventListener('input', calc));
$('f-paid').addEventListener('input', ()=>{ paidManual = true; calc(); });
$('btnAuto').addEventListener('click', ()=>{ paidManual=false; calc(); });
$('cmpChips').addEventListener('change', syncFormUI);
$('f-buy').addEventListener('change', syncFormUI);
$('f-dmethod').addEventListener('change', syncFormUI);
$('f-item').addEventListener('input', ()=>{ refreshDatalists(); updateItemHint(); });
$('f-item').addEventListener('change', ()=>{ fillFromLatest(); refreshDatalists(); updateItemHint(); });
$('f-spec').addEventListener('change', updateItemHint);
$('btnSave').addEventListener('click', save);
$('btnReset').addEventListener('click', resetForm);
$('btnCancel').addEventListener('click', resetForm);
$('l-search').addEventListener('input', renderList);
$('l-buy').addEventListener('change', renderList);
$('btnCsv').addEventListener('click', exportCsv);
$('q-input').addEventListener('input', renderQuery);

/* ---------- 啟動 ---------- */
buildForm();
await initFirebase();
showRemModal(computeReminders().filter(x=>x.active));
</script>
</body>
</html>
